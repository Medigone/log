{#- Styles partagés des impressions (bon de commande, bon de livraison). -#}
<style>
	.mp-doc { position: relative; font-family: "DejaVu Sans", "Helvetica Neue", Arial, sans-serif; font-size: 8.6pt; line-height: 1.45; color: #171717; }
	.mp-doc * { box-sizing: border-box; }
	.mp-break { page-break-after: always; }
	.mp-doc table { width: 100%; border-collapse: collapse; }
	.mp-doc td, .mp-doc th { vertical-align: top; padding: 0; }
	.mp-muted { color: #737373; }
	.mp-num { text-align: right; white-space: nowrap; }
	.mp-label { font-size: 7pt; letter-spacing: 0.08em; text-transform: uppercase; color: #737373; }

	.mp-head td { vertical-align: middle; }
	.mp-brand img { width: 34px; height: auto; vertical-align: middle; margin-right: 10px; }
	.mp-brand-name { display: inline-block; vertical-align: middle; }
	.mp-brand-name strong { display: block; font-size: 12.5pt; letter-spacing: -0.01em; }
	.mp-brand-name span { display: block; font-size: 7.6pt; color: #737373; }
	.mp-title { text-align: right; }
	.mp-title .mp-label { display: block; }
	.mp-title strong { display: block; font-size: 15pt; letter-spacing: -0.02em; margin-top: 1px; }
	.mp-pill { display: inline-block; margin-top: 4px; padding: 1px 8px; border: 1px solid #d4d4d4; border-radius: 999px; font-size: 7.4pt; color: #404040; }
	.mp-pill-dark { background: #171717; border-color: #171717; color: #fff; }

	.mp-rule { height: 1px; background: #171717; margin: 12px 0 14px; }

	.mp-cards td.mp-card-cell { width: 50%; }
	.mp-cards td.mp-gap { width: 12px; }
	.mp-card { border: 1px solid #e5e5e5; border-radius: 6px; padding: 9px 11px; }
	.mp-card .mp-label { margin-bottom: 4px; }
	.mp-card-title { font-size: 10.5pt; font-weight: bold; margin-bottom: 2px; }
	.mp-kv td { padding: 1.5px 0; }
	.mp-kv td.mp-k { color: #737373; width: 34%; }

	.mp-lines { margin-top: 16px; }
	.mp-lines thead { display: table-header-group; }
	.mp-lines tr { page-break-inside: avoid; }
	.mp-lines th { background: #f5f5f5; font-size: 7pt; font-weight: normal; letter-spacing: 0.06em; text-transform: uppercase; color: #525252; padding: 6px 6px; text-align: left; border-bottom: 1px solid #e5e5e5; }
	.mp-lines th.mp-num { text-align: right; }
	.mp-lines td { padding: 6px 6px; border-bottom: 1px solid #eeeeee; }
	.mp-lines td.mp-idx { color: #a3a3a3; width: 22px; }
	.mp-item-name { font-weight: bold; }
	.mp-item-code { font-size: 7.4pt; color: #737373; }
	.mp-lines tfoot td { border-bottom: 0; padding-top: 7px; color: #737373; font-size: 7.6pt; }

	.mp-bottom { margin-top: 16px; page-break-inside: avoid; }
	.mp-bottom td.mp-left { width: 56%; padding-right: 18px; }
	.mp-words { border-left: 2px solid #171717; padding: 2px 0 2px 9px; margin-bottom: 12px; }
	.mp-words strong { display: block; font-size: 8.8pt; }
	.mp-schedule th { font-size: 7pt; font-weight: normal; color: #737373; text-align: left; padding: 3px 0; border-bottom: 1px solid #e5e5e5; }
	.mp-schedule th.mp-num { text-align: right; }
	.mp-schedule td { padding: 3px 0; border-bottom: 1px solid #f0f0f0; }
	.mp-totals td { padding: 3.5px 0; }
	.mp-totals td.mp-num { }
	.mp-totals tr.mp-sub td { border-top: 1px solid #e5e5e5; padding-top: 6px; font-weight: bold; }
	.mp-grand { margin-top: 8px; background: #171717; color: #fff; border-radius: 6px; padding: 9px 11px; }
	.mp-grand table td { vertical-align: middle; }
	.mp-grand .mp-label { color: #a3a3a3; }
	.mp-grand strong { font-size: 13pt; letter-spacing: -0.01em; }

	.mp-terms { margin-top: 14px; font-size: 7.6pt; color: #525252; }
	.mp-sign { margin-top: 26px; page-break-inside: avoid; }
	.mp-sign td.mp-sign-cell { width: 50%; }
	.mp-sign td.mp-gap { width: 24px; }
	.mp-sign-box { border-top: 1px solid #171717; padding-top: 5px; height: 64px; }

	.mp-foot { margin-top: 22px; padding-top: 7px; border-top: 1px solid #e5e5e5; font-size: 7pt; color: #a3a3a3; }
	.mp-foot td.mp-num { text-align: right; }

	.mp-batch { font-size: 7.6pt; white-space: nowrap; }
	.mp-soon { display: inline-block; margin-left: 4px; padding: 0 5px; border: 1px solid #b45309; border-radius: 999px; font-size: 6.6pt; color: #b45309; }
	.mp-qr img { width: 74px; height: 74px; }
	.mp-check { display: inline-block; width: 11px; height: 11px; border: 1px solid #737373; border-radius: 2px; }
	.mp-write { display: inline-block; min-width: 46px; border-bottom: 1px solid #a3a3a3; height: 11px; }
	.mp-wh td { background: #fafafa; font-size: 7.4pt; letter-spacing: 0.06em; text-transform: uppercase; color: #525252; padding: 5px 6px; border-bottom: 1px solid #e5e5e5; }
	.mp-orders td { padding: 3px 0; border-bottom: 1px solid #f0f0f0; }
	.mp-alert { margin-top: 10px; border: 1px solid #b45309; border-radius: 6px; padding: 6px 10px; color: #92400e; font-size: 8pt; }

	.mp-watermark { position: absolute; top: 330px; left: 0; width: 100%; text-align: center; font-size: 72pt; font-weight: bold; letter-spacing: 0.1em; color: rgba(23, 23, 23, 0.05); -webkit-transform: rotate(-24deg); transform: rotate(-24deg); z-index: 0; }
</style>
